          else
            shasum -a 256 "target/${{ matrix.target }}/release/zellij" > "zellij-no-web-${{ matrix.target }}.sha256sum"
          fi

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/release/zellij.exe" -DestinationPath "zellij-no-web-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "target/release/zellij.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  target/release/zellij.exe" | Out-File -Encoding ascii "zellij-no-web-${{ matrix.target }}.sha256sum"

      - name: Upload to GitHub Release (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            zellij-no-web-${{ matrix.target }}.tar.gz
            zellij-no-web-${{ matrix.target }}.sha256sum

      - name: Upload to GitHub Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            zellij-no-web-${{ matrix.target }}.zip
            zellij-no-web-${{ matrix.target }}.sha256sum

      # ===== Windows MSI installer (no-web) =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer (no-web)
        if: runner.os == 'Windows'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\Zellij.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\zellij-no-web-${{ matrix.target }}-installer.msi

      - name: Create MSI checksum (no-web)
        if: runner.os == 'Windows'
        run: |
          $hash = (Get-FileHash "target\wix\zellij-no-web-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  zellij-no-web-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii "zellij-no-web-${{ matrix.target }}-installer.sha256sum"

      - name: Upload MSI to GitHub Release (no-web)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            target\wix\zellij-no-web-${{ matrix.target }}-installer.msi
            zellij-no-web-${{ matrix.target }}-installer.sha256sum

