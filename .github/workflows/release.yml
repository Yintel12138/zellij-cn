name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.44.0-cn1)'
        required: true
        default: 'v0.44.0-cn1'

jobs:
  build-release-normal:
    name: build-release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        include:
          - build: linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - build: linux musl aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - build: linux musl riscv64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          - build: macos x64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - build: windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build release binary (cross-compiled)
        if: matrix.build != 'windows x64'
        run: cargo xtask ci cross ${{ matrix.target }}

      - name: Build release binary (Windows native)
        if: matrix.build == 'windows x64'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          asset_name="zellij-${{ matrix.target }}.tar.gz"
          tar cvzf "${asset_name}" -C "target/${{ matrix.target }}/release" zellij
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            sha256sum "target/${{ matrix.target }}/release/zellij" > "zellij-${{ matrix.target }}.sha256sum"
          else
            shasum -a 256 "target/${{ matrix.target }}/release/zellij" > "zellij-${{ matrix.target }}.sha256sum"
          fi

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/release/zellij.exe" -DestinationPath "zellij-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "target/release/zellij.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  target/release/zellij.exe" | Out-File -Encoding ascii "zellij-${{ matrix.target }}.sha256sum"

      - name: Upload to GitHub Release (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            zellij-${{ matrix.target }}.tar.gz
            zellij-${{ matrix.target }}.sha256sum

      - name: Upload to GitHub Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            zellij-${{ matrix.target }}.zip
            zellij-${{ matrix.target }}.sha256sum

      # ===== Windows MSI installer =====
      - name: Install WiX v6
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Add WiX UI extension
        if: runner.os == 'Windows'
        run: wix extension add WixToolset.UI.wixext/6.0.2

      - name: Build MSI installer
        if: runner.os == 'Windows'
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path target\wix
          wix build wix\main.wxs wix\Zellij.wxl `
            -d Version=$version `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o target\wix\zellij-x86_64-pc-windows-msvc-installer.msi

      - name: Create MSI checksum
        if: runner.os == 'Windows'
        run: |
          $hash = (Get-FileHash "target\wix\zellij-${{ matrix.target }}-installer.msi" -Algorithm SHA256).Hash.ToLower()
          "$hash  zellij-${{ matrix.target }}-installer.msi" | Out-File -Encoding ascii "zellij-${{ matrix.target }}-installer.sha256sum"

      - name: Upload MSI to GitHub Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            target\wix\zellij-${{ matrix.target }}-installer.msi
            zellij-${{ matrix.target }}-installer.sha256sum

  build-release-noweb:
    name: build-release-noweb (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        include:
          - build: linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - build: linux musl aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - build: linux musl riscv64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          - build: macos x64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - build: windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: "${{ matrix.target }},wasm32-wasip1"
          cache: false
          rustflags: ""

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build release binary (cross-compiled, no-web)
        if: matrix.build != 'windows x64'
        run: cargo xtask ci cross ${{ matrix.target }} --no-web

      - name: Build release binary (Windows native, no-web)
        if: matrix.build == 'windows x64'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo xtask ci build-release --no-web

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
